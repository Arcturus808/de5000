name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: de5000-tauri/src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure git to use GitHub token
        run: git config --global url."https://x-access-token:${{ secrets.PAT_GITHUB_TOKEN }}@github.com/Arcturus808/".insteadOf "https://github.com/Arcturus808/"

      - name: Install frontend dependencies
        working-directory: de5000-tauri
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: de5000-tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'DE-5000 Monitor ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download the latest version.'
          releaseDraft: true
          prerelease: true
